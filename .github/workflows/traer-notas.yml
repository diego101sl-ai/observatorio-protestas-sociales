# Descarga el texto completo de las notas publicadas en medios (scripts/traer_notas.py)
# y lo guarda en notas/src/*.md. Se ejecuta a mano o al cambiar el script o la lista.

name: Traer notas publicadas

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Volver a descargar las notas que ya existen"
        required: false
        default: "no"
  push:
    paths:
      - "scripts/traer_notas.py"
      - ".github/workflows/traer-notas.yml"

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Descargar notas
        run: |
          if [ "${{ github.event.inputs.forzar }}" = "si" ]; then python3 scripts/traer_notas.py --forzar; else python3 scripts/traer_notas.py; fi
      - name: Publicar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notas/src
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Traer el texto de las notas publicadas" && git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}")
