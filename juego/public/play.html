<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cierre de Edición — Jugar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗞️</text></svg>">
<link rel="stylesheet" href="/css/estilo.css">
<style>
  body {
    display: flex; flex-direction: column;
    min-height: 100vh; min-height: 100dvh;
    padding: 1rem;
    gap: 0.9rem;
    max-width: 34rem; margin: 0 auto;
  }
  header { display: flex; align-items: center; gap: 0.6rem; }
  header .marca { font-size: 0.95rem; }
  header .derecha { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }

  main { flex: 1; display: flex; flex-direction: column; }
  section { flex: 1; display: flex; flex-direction: column; gap: 1rem; }

  /* --- entrar --- */
  #entrar { justify-content: center; }
  #entrar h1 { font-size: 1.9rem; text-align: center; }
  #entrar h1 span { color: var(--amarillo); }
  #entrar form { display: flex; flex-direction: column; gap: 0.9rem; }
  #entrar label { display: flex; flex-direction: column; gap: 0.35rem; }
  #entrar input {
    font: inherit; font-size: 1.2rem;
    background: var(--tinta-2); color: var(--papel);
    border: 1px solid var(--linea); border-radius: 8px;
    padding: 0.8rem 1rem;
  }
  #entrar input:focus-visible { outline: 2px solid var(--amarillo); }
  #entrar input#codigo { font-family: var(--mono); letter-spacing: 0.3em; text-align: center; }
  #error { color: var(--error); font-weight: 600; min-height: 1.3em; text-align: center; }

  /* --- espera --- */
  #espera { justify-content: center; align-items: center; text-align: center; gap: 1.2rem; }
  #espera .credencial {
    background: var(--tinta-2); border: 1px solid var(--linea); border-radius: 12px;
    padding: 1.4rem 2rem; display: flex; flex-direction: column; gap: 0.5rem; align-items: center;
    border-top: 5px solid var(--amarillo);
  }
  #espera .credencial .quien { font-size: 1.5rem; font-weight: 900; }
  #mi-coleccion { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; max-width: 22rem; }

  /* --- pregunta --- */
  #pregunta { gap: 0.7rem; }
  #texto-preg { font-weight: 800; font-size: 1.05rem; line-height: 1.35; }
  #contexto-preg {
    color: var(--gris); font-size: 0.9rem; line-height: 1.45;
    max-height: 8.2em; overflow: hidden;
  }
  #opciones { flex: 1; display: grid; grid-template-columns: 1fr; gap: 0.7rem; align-content: stretch; }
  #opciones .opcion { font-size: 1rem; font-weight: 600; }

  /* --- respondido / resultado --- */
  #estado { justify-content: center; align-items: center; text-align: center; gap: 1rem; }
  #estado .gigante { font-size: 4rem; }
  #estado h2 { font-size: 1.7rem; }
  #estado .puntos-ganados { font-family: var(--mono); font-size: 1.4rem; color: var(--amarillo); }
  #estado .posicion { color: var(--gris); }

  /* --- fin --- */
  #fin { align-items: center; text-align: center; gap: 1rem; overflow-y: auto; }
  #fin .medalla { font-size: 4.5rem; line-height: 1; }
  #fin h2 { font-size: 1.6rem; }
  #fin .resumen { color: var(--gris); line-height: 1.5; }
  #fin .grupo-insignias { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
</style>
</head>
<body>
  <header>
    <span class="marca"><span class="sello">Cierre</span> de Edición</span>
    <div class="derecha">
      <span id="chip-yo" class="chip oculto"></span>
      <span id="chip-puntos" class="chip oculto tele"></span>
    </div>
  </header>

  <main>
    <!-- Entrar -->
    <section id="entrar">
      <h1 class="titular">Entrá a la <span>redacción</span></h1>
      <form id="form-entrar">
        <label>
          <span class="etiqueta">Código de sala</span>
          <input id="codigo" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off" required>
        </label>
        <label>
          <span class="etiqueta">Tu nombre (siempre el mismo, guarda tu historial)</span>
          <input id="nombre" maxlength="24" placeholder="Nombre y apellido" autocomplete="name" required>
        </label>
        <div id="error"></div>
        <button type="submit" class="boton">Entrar</button>
      </form>
    </section>

    <!-- Espera -->
    <section id="espera" class="oculto">
      <div class="credencial">
        <span class="etiqueta">Credencial de prensa</span>
        <span class="quien" id="cred-nombre"></span>
        <span class="etiqueta" id="cred-partidas"></span>
      </div>
      <div id="mi-coleccion"></div>
      <p class="etiqueta">Mirá la pantalla central. La partida empieza en cualquier momento…</p>
    </section>

    <!-- Pregunta -->
    <section id="pregunta" class="oculto">
      <div class="barra-tiempo" id="barra-j"><div></div></div>
      <div id="texto-preg"></div>
      <div id="contexto-preg"></div>
      <div id="opciones"></div>
    </section>

    <!-- Estado (respondido / resultado) -->
    <section id="estado" class="oculto">
      <div class="gigante" id="estado-emoji">✍️</div>
      <h2 class="titular" id="estado-titulo"></h2>
      <div class="puntos-ganados" id="estado-puntos"></div>
      <div class="posicion" id="estado-posicion"></div>
    </section>

    <!-- Final -->
    <section id="fin" class="oculto">
      <div class="medalla" id="fin-medalla"></div>
      <h2 class="titular" id="fin-titulo"></h2>
      <div class="resumen" id="fin-resumen"></div>
      <div class="grupo-insignias" id="fin-nuevas"></div>
      <span class="etiqueta">Tu colección</span>
      <div class="grupo-insignias" id="fin-coleccion"></div>
      <p class="etiqueta">Quedate: el capacitador puede lanzar otra partida.</p>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
